spring:
  application:
    name: workday-lister
  datasource:
    # Matches the MySQL service in the repo-root compose.yaml. MYSQL_PORT is shared with Compose.
    url: jdbc:mysql://localhost:${MYSQL_PORT:3306}/workdaylister
    username: workday
    password: workday
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      # Health lives under the API prefix so the Vite proxy reaches it: GET /api/health
      base-path: /api
      exposure:
        include: health
      discovery:
        enabled: false
  endpoint:
    health:
      show-components: always

# Scrape Run tunables (scraper.pacing-interval, scraper.retry-count, scraper.timezone) and the
# Workday client endpoint (workday.client.scheme, workday.client.host; ADR-0001) have their defaults
# on the records in io.github.n3vin2.workdaylister.config. Override them with environment variables
# such as SCRAPER_PACING_INTERVAL or WORKDAY_CLIENT_HOST; see README.md.
